<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Trocas - Copa 2026</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #1a365d; }
    .card-troca { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
    .header-card { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .nome { font-size: 20px; font-weight: bold; color: #2c3e50; }
    .btn-zap { background: #25D366; color: white; text-decoration: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .secao { margin-bottom: 10px; }
    .titulo-secao { font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    .repetidas .titulo-secao { color: #27ae60; }
    .faltantes .titulo-secao { color: #e74c3c; }
    .badge { display: inline-block; background: #ecf0f1; padding: 4px 8px; border-radius: 4px; font-size: 13px; margin: 2px; border: 1px solid #bdc3c7; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // COLE AQUI A URL DO SEU APPS SCRIPT GERADA NO PASSO 1
    const GOOGLE_SHEETS_API = 'COLE_SUA_URL_AQUI';

    function App() {
      const [colecionadores, setColecionadores] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(GOOGLE_SHEETS_API)
          .then(res => res.json())
          .then(data => {
            setColecionadores(data);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      }, []);

      if (loading) return <h2 style={{textAlign: 'center'}}>Buscando colecionadores na região... 🔍</h2>;

      return (
        <div className="container">
          <h1>Mural de Trocas ⚽</h1>
          
          {colecionadores.map((pessoa, index) => (
            <div key={index} className="card-troca">
              <div className="header-card">
                <span className="nome">{pessoa.Nome}</span>
                <a 
                  href={`https://wa.me/55${pessoa.WhatsApp.replace(/\D/g, '')}?text=Opa ${pessoa.Nome}, vi no Mural que você tem figurinhas repetidas! Bora trocar?`} 
                  target="_blank" 
                  className="btn-zap"
                >
                  WhatsApp
                </a>
              </div>

              <div className="secao repetidas">
                <div className="titulo-secao">Disponíveis para Troca (Repetidas):</div>
                <div>
                  {pessoa.Repetidas.split(',').map(fig => fig.trim()).map(fig => (
                    <span key={fig} className="badge">{fig}</span>
                  ))}
                </div>
              </div>

              <div className="secao faltantes">
                <div className="titulo-secao">Procura (Faltantes):</div>
                <div>
                  {pessoa.Faltantes.split(',').map(fig => fig.trim()).map(fig => (
                    <span key={fig} className="badge">{fig}</span>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
