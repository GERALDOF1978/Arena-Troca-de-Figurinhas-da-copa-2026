<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum Copa 2026</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: #0f172a;
      background-image: radial-gradient(circle at 50% -20%, #312e81, #0f172a);
      color: #fff;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; font-weight: 900; font-size: 2.5rem; background: linear-gradient(to right, #00ff87, #60efff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; }
    
    .painel-status { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .progress-bar-bg { width: 100%; background: #1e293b; border-radius: 10px; height: 15px; overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #00ff87, #60efff); transition: width 0.5s ease-out; }
    
    .btn-pacote { display: block; width: 100%; background: linear-gradient(45deg, #ff004d, #ff5e62); color: white; border: none; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 0, 77, 0.4); margin-bottom: 30px; }
    .btn-pacote:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 0, 77, 0.6); }

    .filtros { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .btn-filtro { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-filtro.ativo { background: #3b82f6; color: white; border-color: #3b82f6; }

    .pacotinho-area { background: rgba(255, 215, 0, 0.1); border: 2px dashed #ffd700; border-radius: 15px; padding: 30px; text-align: center; margin-bottom: 30px; }
    
    .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
    
    .card { width: 100px; height: 140px; background: #1e293b; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #334155; position: relative; overflow: hidden; transition: 0.3s; cursor: pointer; padding: 5px; box-sizing: border-box; }
    .card:hover { transform: scale(1.05); }
    .card strong { font-size: 1.1rem; z-index: 2; margin-top: 5px; }
    .card span { font-size: 0.65rem; text-align: center; padding: 0 2px; color: #94a3b8; z-index: 2; }
    
    .foto-jogador { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 4px 6px rgba(0,0,0,0.2); object-fit: cover; }
    .misterio { width: 50px; height: 50px; border-radius: 50%; background: #334155; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 2px dashed #475569; }

    .card.tenho { border-color: #00ff87; background: #064e3b; color: white; }
    .card.tenho span { color: #a7f3d0; }
    .card.tenho::before { content: '✓'; position: absolute; top: 5px; right: 5px; color: #00ff87; font-weight: bold; font-size: 12px; }
    
    .card.nova { animation: dropGlow 0.6s ease-out forwards; background: linear-gradient(135deg, #ffd700, #ff8c00); color: black; border: none; }
    .card.nova span { color: #333; }
    
    @keyframes dropGlow {
      0% { transform: scale(0) translateY(-50px); opacity: 0; }
      70% { transform: scale(1.1) translateY(0); opacity: 1; }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = 'https://raw.githubusercontent.com/danieltartaro/sticker-swap/main/data/raw/panini-wc-2026-catalog.json';

    function App() {
      const [album, setAlbum] = useState([]);
      const [loading, setLoading] = useState(true);
      const [obtidas, setObtidas] = useState(new Set());
      const [pacote, setPacote] = useState([]);
      const [filtro, setFiltro] = useState('todas'); 

      // Busca os dados e garante que sempre extraia uma Lista (Array) para evitar erros
      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            let listaFigurinhas = [];
            
            // Tratativa de segurança: extrai o array não importa o formato do JSON
            if (Array.isArray(data)) {
              listaFigurinhas = data;
            } else if (data && data.stickers) {
              listaFigurinhas = data.stickers;
            } else if (data && data.data) {
              listaFigurinhas = data.data;
            } else if (data && data.selecoes) {
              listaFigurinhas = data.selecoes.flatMap(selecao => selecao.figurinhas || []);
            } else {
              listaFigurinhas = Object.values(data).find(val => Array.isArray(val)) || [];
            }

            setAlbum(listaFigurinhas);
            setLoading(false);
          })
          .catch(error => {
            console.error("Erro ao carregar o álbum:", error);
            setLoading(false);
          });

        const salvas = localStorage.getItem('albumFilhote2026');
        if (salvas) setObtidas(new Set(JSON.parse(salvas)));
      }, []);

      useEffect(() => {
        if (obtidas.size > 0) {
          localStorage.setItem('albumFilhote2026', JSON.stringify([...obtidas]));
        }
      }, [obtidas]);

      const abrirPacotinho = () => {
        if (album.length === 0) return;
        const novas = [];
        for (let i = 0; i < 5; i++) {
          novas.push(album[Math.floor(Math.random() * album.length)]);
        }
        setPacote(novas);
        setObtidas(prev => new Set([...prev, ...novas.map(f => f.code)]));
      };

      if (loading) return <h2 style={{textAlign: 'center', marginTop: '20vh', color: '#00ff87'}}>AQUECENDO OS JOGADORES... ⚽</h2>;

      const progressoPct = album.length > 0 ? ((obtidas.size / album.length) * 100).toFixed(1) : 0;

      const figurinhasFiltradas = album.filter(fig => {
        if (filtro === 'tenho') return obtidas.has(fig.code);
        if (filtro === 'faltam') return !obtidas.has(fig.code);
        return true;
      });

      return (
        <div className="container">
          <h1>Copa do Mundo 2026</h1>
          
          <div className="painel-status">
            <h2 style={{margin: '0 0 10px 0'}}>Progresso: {obtidas.size} / {album.length} ({progressoPct}%)</h2>
            <div className="progress-bar-bg">
              <div className="progress-bar-fill" style={{ width: `${progressoPct}%` }}></div>
            </div>
          </div>

          <button className="btn-pacote" onClick={abrirPacotinho}>
            🎁 Rasgar Pacotinho
          </button>

          {/* ÁREA DO PACOTINHO (Com Avatares Coloridos) */}
          {pacote.length > 0 && (
            <div className="pacotinho-area">
              <h3 style={{color: '#ffd700', marginTop: 0}}>Figurinhas Encontradas!</h3>
              <div className="grid">
                {pacote.map((f, i) => {
                  const urlImagem = `https://ui-avatars.com/api/?name=${encodeURIComponent(f.name || f.code)}&background=random&color=fff&size=100&bold=true`;
                  return (
                    <div key={i} className="card nova">
                      <img src={urlImagem} alt={f.name} className="foto-jogador"
