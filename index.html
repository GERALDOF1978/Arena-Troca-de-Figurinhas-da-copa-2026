<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum Virtual Copa 2026</title>
  
  <!-- Carregando o React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1a365d; margin-bottom: 30px; }
    .painel { display: flex; justify-content: space-between; align-items: center; background: #eef2f5; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    .btn-pacote { background: #e74c3c; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-pacote:hover { background: #c0392b; transform: scale(1.05); }
    .pacotinho-area { background: #fff3cd; padding: 25px; border-radius: 12px; border: 2px dashed #f1c40f; margin-bottom: 30px; text-align: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .card { width: 85px; height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; text-align: center; font-size: 11px; transition: 0.3s; }
    .card strong { font-size: 18px; margin-bottom: 5px; }
    .falta { background: #f8f9fa; border: 1px dashed #dee2e6; color: #adb5bd; }
    .tenho { background: #e8f8f5; border: 2px solid #2ecc71; color: #27ae60; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2); }
    .nova { animation: pular 0.5s ease-out; background: linear-gradient(135deg, #f1c40f, #f39c12); color: white; font-weight: bold; box-shadow: 0 6px 10px rgba(0,0,0,0.15); }
    .btn-fechar { margin-top: 20px; padding: 10px 20px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; }
    @keyframes pular { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // API com as mais de 1000 figurinhas da Copa de 2026
    const API_URL = 'https://raw.githubusercontent.com/danieltartaro/sticker-swap/main/data/raw/panini-wc-2026-catalog.json';

    function App() {
      const [album, setAlbum] = useState([]);
      const [loading, setLoading] = useState(true);
      const [figurinhasObtidas, setFigurinhasObtidas] = useState(new Set());
      const [pacotinhoAtual, setPacotinhoAtual] = useState([]);

      // Busca o catálogo oficial no GitHub
      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            // 1. Vamos ver no F12 o formato exato que o GitHub enviou
            console.log("Dados brutos do GitHub:", data);

            let listaFigurinhas = [];

            // 2. Lógica para extrair apenas o Array, não importa a estrutura do JSON
            if (Array.isArray(data)) {
              // Se já vier como uma lista limpa
              listaFigurinhas = data;
            } else if (data && data.stickers) {
              // Se a lista estiver dentro de uma propriedade "stickers"
              listaFigurinhas = data.stickers;
            } else if (data && data.data) {
              // Se a lista estiver dentro de uma propriedade "data"
              listaFigurinhas = data.data;
            } else if (data && data.selecoes) {
              // Se estiver dividido por seleções, juntamos todas em uma lista só (flat)
              listaFigurinhas = data.selecoes.flatMap(selecao => selecao.figurinhas || []);
            } else {
              // Tenta procurar e extrair qualquer Array que estiver dentro do objeto principal
              listaFigurinhas = Object.values(data).find(val => Array.isArray(val)) || [];
            }

            // 3. Agora sim, salvamos APENAS a lista no estado
            setAlbum(listaFigurinhas);
            setLoading(false);
          })
          .catch(error => {
            console.error("Erro ao buscar a API:", error);
            setLoading(false);
          });

        const salvas = localStorage.getItem('albumAtleta2026');
        if (salvas) setObtidas(new Set(JSON.parse(salvas)));
      }, []);

      // Salva automaticamente cada figurinha nova
      useEffect(() => {
        if (figurinhasObtidas.size > 0) {
          localStorage.setItem('albumFilhote2026', JSON.stringify([...figurinhasObtidas]));
        }
      }, [figurinhasObtidas]);

      // Sorteia 5 figurinhas aleatórias do banco de dados
      const abrirPacotinho = () => {
        const novas = [];
        for (let i = 0; i < 5; i++) {
          const sorteada = album[Math.floor(Math.random() * album.length)];
          novas.push(sorteada);
        }
        setPacotinhoAtual(novas);
        setFigurinhasObtidas(prev => new Set([...prev, ...novas.map(f => f.code)]));
      };

      if (loading) return <h2 style={{textAlign: 'center', marginTop: '50px'}}>Carregando o estádio... ⚽</h2>;

      return (
        <div className="container">
          <h1>Álbum Virtual da Copa 2026 🏆</h1>
          
          <div className="painel">
            <h2>Completado: {figurinhasObtidas.size} de {album.length}</h2>
            <button className="btn-pacote" onClick={abrirPacotinho}>
              🎁 Abrir Pacotinho (5)
            </button>
          </div>

          {pacotinhoAtual.length > 0 && (
            <div className="pacotinho-area">
              <h3>Você tirou no pacotinho:</h3>
              <div className="grid">
                {pacotinhoAtual.map((f, i) => (
                  <div key={i} className="card nova">
                    <strong>{f.code}</strong>
                    <span>{f.name}</span>
                  </div>
                ))}
              </div>
              <button className="btn-fechar" onClick={() => setPacotinhoAtual([])}>
                Colar no Álbum
              </button>
            </div>
          )}

          <h3 style={{ color: '#2c3e50', borderBottom: '2px solid #ecf0f1', paddingBottom: '10px' }}>O Álbum</h3>
          <div className="grid">
            {album.map((figurinha) => {
              const tenho = figurinhasObtidas.has(figurinha.code);
              return (
                <div key={figurinha.code} className={`card ${tenho ? 'tenho' : 'falta'}`}>
                  <strong>{figurinha.code}</strong>
                  {tenho && <span>{figurinha.name}</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
