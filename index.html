<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum Oficial 2026</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 50px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; font-weight: 900; font-size: 2.2rem; color: #38bdf8; text-transform: uppercase; margin-bottom: 30px; }
    
    /* Área do Pacotinho */
    .btn-pacote { width: 100%; background: linear-gradient(45deg, #e11d48, #f43f5e); color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); margin-bottom: 20px; }
    .btn-pacote:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(225, 29, 72, 0.6); }
    .pacotinho-area { background: rgba(250, 204, 21, 0.1); border: 2px dashed #facc15; border-radius: 15px; padding: 30px; text-align: center; margin-bottom: 40px; }
    
    /* Estilo das Seções (Páginas por Seleção) */
    .secao-selecao { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-top: 4px solid #38bdf8; }
    .header-selecao { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
    .header-selecao h2 { margin: 0; color: #f8fafc; font-size: 1.5rem; text-transform: uppercase; }
    .badge-progresso { background: #0ea5e9; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    
    .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    
    /* Cards das Figurinhas */
    .card { width: 95px; height: 135px; background: #0f172a; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #334155; position: relative; padding: 5px; box-sizing: border-box; }
    .card strong { font-size: 1.2rem; margin-top: 5px; z-index: 2; }
    .card span { font-size: 0.65rem; text-align: center; color: #94a3b8; z-index: 2; line-height: 1.1; }
    
    .foto-jogador { width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
    .misterio { width: 45px; height: 45px; border-radius: 50%; background: #1e293b; display: flex; justify-content: center; align-items: center; font-size: 18px; border: 2px dashed #475569; }

    .card.tenho { border-color: #22c55e; background: #064e3b; color: white; }
    .card.tenho span { color: #86efac; }
    .card.tenho::before { content: '✓'; position: absolute; top: 5px; right: 5px; color: #4ade80; font-weight: bold; font-size: 14px; }
    
    .card.nova { animation: pular 0.6s ease-out forwards; background: linear-gradient(135deg, #facc15, #eab308); color: #000; border: none; }
    .card.nova span { color: #1e293b; font-weight: bold; }
    
    @keyframes pular { 0% { transform: scale(0) translateY(-50px); } 70% { transform: scale(1.1) translateY(0); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'https://raw.githubusercontent.com/danieltartaro/sticker-swap/main/data/raw/panini-wc-2026-catalog.json';

    function App() {
      const [album, setAlbum] = useState([]);
      const [loading, setLoading] = useState(true);
      const [obtidas, setObtidas] = useState(new Set());
      const [pacote, setPacote] = useState([]);

      useEffect(() => {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            let lista = Array.isArray(data) ? data : (data.stickers || data.data || []);
            if(lista.length === 0) {
              lista = Object.values(data).find(val => Array.isArray(val)) || [];
            }
            setAlbum(lista);
            setLoading(false);
          });

        const salvas = localStorage.getItem('meuAlbumCopa26');
        if (salvas) setObtidas(new Set(JSON.parse(salvas)));
      }, []);

      useEffect(() => {
        if (obtidas.size > 0) {
          localStorage.setItem('meuAlbumCopa26', JSON.stringify([...obtidas]));
        }
      }, [obtidas]);

      const abrirPacotinho = () => {
        if (album.length === 0) return;
        const novas = [];
        for (let i = 0; i < 5; i++) {
          novas.push(album[Math.floor(Math.random() * album.length)]);
        }
        setPacote(novas);
        setObtidas(prev => new Set([...prev, ...novas.map(f => f.code)]));
      };

      if (loading) return <h2 style={{textAlign: 'center', marginTop: '20vh', color: '#38bdf8'}}>Preparando o gramado... ⚽</h2>;

      // 🏆 A GRANDE MÁGICA: Agrupar as figurinhas por Seleção (extraindo as letras do código, ex: BRA, ARG)
      const albumAgrupado = album.reduce((grupos, fig) => {
        const sigla = fig.code.replace(/[0-9]/g, ''); // Tira os números, sobra a sigla
        if (!grupos[sigla]) grupos[sigla] = [];
        grupos[sigla].push(fig);
        return grupos;
      }, {});

      return (
        <div className="container">
          <h1>Álbum Virtual Copa 2026</h1>
          
          <button className="btn-pacote" onClick={abrirPacotinho}>
            🎁 Abrir Pacotinho Surpresa
          </button>

          {/* PACOTINHO ABERTO */}
          {pacote.length > 0 && (
            <div className="pacotinho-area">
              <h3 style={{color: '#facc15', marginTop: 0, textTransform: 'uppercase'}}>Você tirou:</h3>
              <div className="grid">
                {pacote.map((f, i) => {
                  const urlImagem = `https://ui-avatars.com/api/?name=${encodeURIComponent(f.name || f.code)}&background=random&color=fff&size=100&bold=true`;
                  return (
                    <div key={i} className="card nova">
                      <img src={urlImagem} alt={f.name} className="foto-jogador" />
                      <strong>{f.code}</strong>
                      <span>{f.name}</span>
                    </div>
                  );
                })}
              </div>
              <button 
                onClick={() => setPacote([])} 
                style={{marginTop: '25px', padding: '10px 25px', background: '#facc15', color: '#000', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold'}}
              >
                Colar no Álbum
              </button>
            </div>
          )}

          {/* ÁLBUM ORGANIZADO POR PÁGINAS (SELEÇÕES) */}
          {Object.entries(albumAgrupado).map(([sigla, figurinhasDaSelecao]) => {
            // Calcula quantas figurinhas ele já tem dessa seleção específica
            const tenhoDessaSelecao = figurinhasDaSelecao.filter(fig => obtidas.has(fig.code)).length;
            
            return (
              <div key={sigla} className="secao-selecao">
                <div className="header-selecao">
                  <h2>Equipe {sigla}</h2>
                  <span className="badge-progresso">
                    {tenhoDessaSelecao} / {figurinhasDaSelecao.length}
                  </span>
                </div>
                
                <div className="grid">
                  {figurinhasDaSelecao.map(fig => {
                    const tenho = obtidas.has(fig.code);
                    const urlImagem = `https://ui-avatars.com/api/?name=${encodeURIComponent(fig.name || fig.code)}&background=random&color=fff&size=100&bold=true`;

                    return (
                      <div key={fig.code} className={`card ${tenho ? 'tenho' : 'falta'}`}>
                        {tenho ? (
                          <img src={urlImagem} alt={fig.name} className="foto-jogador" />
                        ) : (
                          <div className="misterio">❓</div>
                        )}
                        <strong>{fig.code}</strong>
                        <span>{fig.name}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
